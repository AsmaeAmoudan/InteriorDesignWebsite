<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" role="img" aria-label="Savoir-faire et matériaux">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FAF8F4"/>
      <stop offset="100%" stop-color="#F1EDE6"/>
    </linearGradient>
    <linearGradient id="floor" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#D8C3A5" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#B79B78" stop-opacity="0.4"/>
    </linearGradient>
  </defs>
  <rect width="1000" height="700" fill="url(#bg)"/>
  <rect x="0" y="504" width="1000" height="196" fill="url(#floor)"/>
  
  <g opacity="0.8">
    <rect x="300" y="210" width="400" height="280" rx="8" fill="#D8C3A5"/>
    <rect x="350" y="244" width="300" height="210" rx="4" fill="#FAF8F4"/>
    <line x1="350" y1="350" x2="650" y2="350" stroke="#B79B78" stroke-width="1"/>
    <line x1="500" y1="244" x2="500" y2="455" stroke="#B79B78" stroke-width="1"/>
  </g>
  <text x="500" y="670" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#746E67" letter-spacing="2">Savoir-faire et matériaux</text>
  <text x="500" y="688" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#746E67" letter-spacing="1">Bois clair, lin et céramique</text>
</svg>